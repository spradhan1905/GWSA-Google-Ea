<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GWSA GeoAnalytics | Goodwill Industries of San Antonio" />
    <title>GWSA GeoAnalytics</title>
    <link rel="icon" type="image/png" href="/assets/goodwill-san-antonio-logo.png?v=gwsa-logo-2" />
    <link rel="shortcut icon" type="image/png" href="/assets/goodwill-san-antonio-logo.png?v=gwsa-logo-2" />
    <link rel="apple-touch-icon" href="/assets/goodwill-san-antonio-logo.png?v=gwsa-logo-2" />
    <script>
      (() => {
        const iconUrl = '/assets/goodwill-san-antonio-logo.png?v=gwsa-logo-2';
        document.querySelectorAll("link[rel*='icon']").forEach((link) => link.remove());
        ['icon', 'shortcut icon', 'apple-touch-icon'].forEach((rel) => {
          const link = document.createElement('link');
          link.rel = rel;
          link.type = 'image/png';
          link.href = iconUrl;
          document.head.appendChild(link);
        });
      })();
    </script>
  </head>
  <body class="bg-gwsa-bg text-gwsa-text font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
